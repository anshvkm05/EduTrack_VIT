{% extends "base.html" %}
{% block title %}Sign In | EduTrack VIT{% endblock %}
{% block page_title %}{% endblock %}

{% block login_content %}
<div class="login-card">
  <!-- Brand -->
  <div class="login-brand">
    <div class="login-logo-icon">ET</div>
    <div>
      <div class="login-brand-name">EduTrack <span>VIT</span></div>
    </div>
  </div>

  <h2 class="login-title">Welcome back</h2>
  <p class="login-sub">Sign in to manage your institute.</p>

  <form class="login-form" method="post" autocomplete="on">
    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input
        class="form-control"
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        placeholder="admin"
        required
        autofocus
      >
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input
        class="form-control"
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        placeholder="••••••••"
        required
      >
    </div>
    <button class="btn btn-primary login-btn" type="submit">
      Sign In
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
      </svg>
    </button>
  </form>

  <p style="margin-top:20px; font-size:11px; color:var(--ink-3); text-align:center;">
    EduTrack VIT · Coaching Institute Management System
  </p>
</div>
{% endblock %}
