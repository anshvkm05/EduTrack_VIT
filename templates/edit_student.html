{% extends "base.html" %}
{% block title %}Edit Student | EduTrack VIT{% endblock %}
{% block page_title %}Edit Student{% endblock %}

{% block content %}

<div class="page-header">
  <div class="page-header-left">
    <div class="page-eyebrow">Students</div>
    <h1 class="page-h1">Edit — {{ student.name }}</h1>
    <p class="page-sub">Update the student's details below.</p>
  </div>
  <a href="{{ url_for('students') }}" class="btn btn-secondary">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
    </svg>
    Back to Students
  </a>
</div>

<div class="card">
  <form method="post" autocomplete="off">
    <div class="form-grid">

      <div class="form-group">
        <label class="form-label" for="name">Full Name *</label>
        <input class="form-control" id="name" name="name" type="text"
               value="{{ student.name }}" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address *</label>
        <input class="form-control" id="email" name="email" type="email"
               value="{{ student.email }}" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="phone">Phone Number</label>
        <input class="form-control" id="phone" name="phone" type="tel"
               value="{{ student.phone or '' }}">
      </div>

      <div class="form-group">
        <label class="form-label" for="gender">Gender</label>
        <select class="form-control" id="gender" name="gender">
          <option value="">— Select —</option>
          {% for g in ['Male', 'Female', 'Other'] %}
          <option value="{{ g }}" {% if student.gender == g %}selected{% endif %}>{{ g }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="course_id">Course *</label>
        <select class="form-control" id="course_id" name="course_id" required>
          <option value="">— Select course —</option>
          {% for c in courses %}
          <option value="{{ c.id }}" {% if student.course_id == c.id %}selected{% endif %}>{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="batch_id">Batch</label>
        <select class="form-control" id="batch_id" name="batch_id">
          <option value="">— No batch —</option>
          {% for b in batches %}
          <option value="{{ b.id }}"
                  data-course="{{ b.course_id }}"
                  {% if current_batch_id == b.id %}selected{% endif %}>
            {{ b.name }} ({{ b.time_slot }})
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="date_of_birth">Date of Birth</label>
        <input class="form-control" id="date_of_birth" name="date_of_birth" type="date"
               value="{{ student.date_of_birth or '' }}">
      </div>

      <div class="form-group">
        <label class="form-label" for="status">Status</label>
        <select class="form-control" id="status" name="status">
          {% for s in ['Active', 'Inactive', 'Pending'] %}
          <option value="{{ s }}" {% if student.status == s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>

    </div>

    <div class="form-actions">
      <a href="{{ url_for('students') }}" class="btn btn-secondary">Cancel</a>
      <button class="btn btn-primary" type="submit">
        Save Changes
      </button>
    </div>
  </form>
</div>

{% endblock %}
